[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/rs-shell-core",
    "crates/rs-shell-config",
    "crates/rs-shell-clipboard",
    "crates/rs-shell-api",
    "crates/rs-shell-wm",
    "crates/rs-shell-services",
    "crates/rs-shell-ui",
    "crates/rs-shell-daemon",
    "crates/rs-shell-bar",
]

[workspace.package]
version   = "0.1.0"
edition   = "2021"
license   = "MIT"
authors   = ["rs-shell contributors"]
rust-version = "1.80"

[workspace.dependencies]
# Async
tokio         = { version = "1", features = ["full"] }
tokio-stream  = "0.1"
futures       = "0.3"

# IPC / D-Bus
zbus          = { version = "4", features = ["tokio"] }
zvariant      = "4"

# Serialization
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"

# Storage
rusqlite      = { version = "0.31", features = ["bundled"] }

# UI
gtk4          = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
glib          = "0.20"

# Wayland
wayland-client   = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Error handling
anyhow        = "1"
thiserror     = "1"

# Logging
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config & file watching
notify        = "6"
freedesktop-desktop-entry = "0.8"

# Misc
once_cell     = "1"
parking_lot   = "0.12"
bytes         = "1"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
dirs-next     = "2"
expand-tilde  = "0.1"
async-trait   = "0.1"
libc          = "0.2"

[profile.release]
lto           = "fat"
codegen-units = 1
opt-level     = 3
panic         = "abort"
strip         = "symbols"

[profile.dev]
opt-level     = 1
debug         = 1
